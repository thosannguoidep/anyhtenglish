<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LingoPro — Full-Stack IT English & TOEIC Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col lg:flex-row font-sans selection:bg-indigo-500 selection:text-white">

  <!-- SIDEBAR -->
  <aside class="w-full lg:w-72 bg-slate-900/95 border-b lg:border-b-0 lg:border-r border-slate-800 flex flex-col justify-between shrink-0 lg:sticky lg:top-0 lg:h-screen z-30">
    <div>
      <div class="p-5 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center text-white font-black text-lg shadow-lg shadow-indigo-500/20">
            LP
          </div>
          <div>
            <h1 class="font-bold text-base tracking-tight text-white flex items-center gap-2">
              LingoPro <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">v3.2</span>
            </h1>
            <p class="text-xs text-slate-400">Full-Stack EdTech Platform</p>
          </div>
        </div>
      </div>

      <nav class="p-3 space-y-1.5" id="sidebarNav">
        <button onclick="App.switchTab('dashboard')" data-tab="dashboard" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
          <i class="fa-solid fa-chart-pie w-5 text-center text-indigo-400"></i>
          <span>Dashboard Phân Tích</span>
        </button>

        <button onclick="App.switchTab('it_esp')" data-tab="it_esp" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-laptop-code w-5 text-center text-cyan-400"></i>
            <span>Tiếng Anh CNTT (Unit 1 & 2)</span>
          </div>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">HOT</span>
        </button>

        <button onclick="App.switchTab('srs')" data-tab="srs" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-layer-group w-5 text-center text-emerald-400"></i>
            <span>Flashcard SRS (SM-2)</span>
          </div>
          <span id="srsBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300">0</span>
        </button>

        <button onclick="App.switchTab('toeic')" data-tab="toeic" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
          <i class="fa-solid fa-file-signature w-5 text-center text-amber-400"></i>
          <span>Phòng Thi TOEIC Part 7</span>
        </button>

        <button onclick="App.switchTab('admin')" data-tab="admin" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
          <i class="fa-solid fa-server w-5 text-center text-rose-400"></i>
          <span>Admin CMS & API Log</span>
        </button>
      </nav>
    </div>

    <div class="p-4 border-t border-slate-800 bg-slate-900/60 space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-full bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center font-bold text-indigo-300 text-sm">
            LN
          </div>
          <div>
            <p class="text-xs font-semibold text-white">Lưu Văn Nam</p>
            <p class="text-[11px] text-slate-400" id="userRoleBadge">Role: ADMIN</p>
          </div>
        </div>
        <button onclick="App.toggleRole()" class="text-[11px] px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          Đổi Role
        </button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-center text-xs bg-slate-950/80 p-2 rounded-xl border border-slate-800">
        <div>
          <span class="text-slate-400 block text-[10px]">Streak</span>
          <span class="font-bold text-amber-400"><i class="fa-solid fa-fire mr-1"></i>14 ngày</span>
        </div>
        <div>
          <span class="text-slate-400 block text-[10px]">Điểm XP</span>
          <span class="font-bold text-indigo-400" id="xpCount">2,450</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 border-b border-slate-800 bg-slate-900/70 backdrop-blur px-6 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <h2 id="pageTitle" class="text-base sm:text-lg font-bold text-white">Tiếng Anh Chuyên Ngành CNTT</h2>
        <span id="apiLatencyBadge" class="hidden sm:inline-flex items-center gap-1.5 text-[11px] px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> API: 24ms
        </span>
      </div>
      <div class="flex items-center gap-2.5">
        <button onclick="AudioEngine.speak('Welcome to LingoPro Full-Stack IT English Platform')" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-volume-high text-cyan-400"></i> Test Audio US
        </button>
        <button onclick="App.resetAllProgress()" class="text-xs px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/20 transition">
          <i class="fa-solid fa-rotate-right mr-1"></i> Reset Dữ Liệu
        </button>
      </div>
    </header>

    <main id="mainView" class="flex-1 p-4 sm:p-6 max-w-7xl w-full mx-auto space-y-6"></main>
  </div>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

  <!-- 1. src/data/ -->
  <script src="./src/data/coreData.js"></script>
  <script src="./src/data/unit1WorkingInIt.js"></script>
  <script src="./src/data/unit2ItSystems.js"></script>
  <!-- 2. src/services/ -->
  <script src="./src/services/audioEngine.js"></script>
  <script src="./src/services/apiClient.js"></script>
  <!-- 3. src/controllers/ -->
  <script src="./src/controllers/appController.js"></script>
</body>
</html>
